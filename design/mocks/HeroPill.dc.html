<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: "Geist", -apple-system, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #f59e0b; } a:hover { color: #fbbf24; }
    svg { display: block; }
    @keyframes dp-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
    @keyframes dp-caret { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</helmet>
<div style="width: 900px; height: 520px; background: #141210; position: relative; overflow: hidden; font-size: 13px; color: #f5efe6; display: flex; flex-direction: column; justify-content: space-between; padding: 36px 40px; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 24px;">
    <span style="width: 110px; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 16px; color: rgba(245,239,230,0.5);">Listening</span>
    <div style="flex-grow: 1; display: flex; justify-content: center;">
      <div style="height: 52px; border-radius: 999px; background: linear-gradient(180deg, #26211c, #1a1714); border: 1px solid rgba(245,158,11,0.35); box-shadow: 0 0 0 6px rgba(245,158,11,0.07), 0 20px 50px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.08) inset; display: flex; align-items: center; gap: 16px; padding: 0 22px 0 18px;">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #f59e0b; box-shadow: 0 0 14px rgba(245,158,11,0.9); animation: dp-pulse 1.2s ease-in-out infinite;"></span>
        <svg width="260" height="30" viewBox="0 0 260 30" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"><path d="M2 15 C 10 15, 12 6, 20 6 S 30 24, 38 24 S 48 3, 56 3 S 66 27, 74 27 S 84 10, 92 10 S 102 20, 110 20 S 120 1, 128 1 S 138 29, 146 29 S 156 12, 164 12 S 174 18, 182 18 S 192 7, 200 7 S 210 23, 218 23 S 228 13, 236 13 S 250 15, 258 15"></path></svg>
        <span style="font-size: 12px; color: rgba(245,239,230,0.5); font-variant-numeric: tabular-nums;">0:04</span>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 24px;">
    <span style="width: 110px; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 16px; color: rgba(245,239,230,0.5);">Transcribing</span>
    <div style="flex-grow: 1; display: flex; justify-content: center;">
      <div style="width: 460px; border-radius: 22px; background: linear-gradient(180deg, #26211c, #1a1714); border: 1px solid rgba(255,220,170,0.16); box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.08) inset; display: flex; flex-direction: column; gap: 10px; padding: 16px 22px;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 20px; line-height: 1.3; color: #f5efe6;">Can we move standup to 10 so the Berlin folks<span style="display: inline-block; width: 2px; height: 20px; background: #f59e0b; margin-left: 2px; vertical-align: text-bottom; animation: dp-caret 0.9s steps(1) infinite;"></span></span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 11px; color: rgba(245,239,230,0.45);">
          <span style="width: 40px; height: 3px; border-radius: 2px; background: rgba(245,158,11,0.2); position: relative; overflow: hidden;"><span style="position: absolute; left: 0; top: 0; width: 28px; height: 3px; border-radius: 2px; background: #f59e0b;"></span></span>
          <span>Parakeet v3 · 0.2s</span>
        </span>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 24px;">
    <span style="width: 110px; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 16px; color: rgba(245,239,230,0.5);">Pasted</span>
    <div style="flex-grow: 1; display: flex; justify-content: center;">
      <div style="height: 52px; border-radius: 999px; background: linear-gradient(180deg, #26211c, #1a1714); border: 1px solid rgba(132,204,22,0.35); box-shadow: 0 0 0 6px rgba(132,204,22,0.06), 0 20px 50px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.08) inset; display: flex; align-items: center; gap: 14px; padding: 0 22px 0 16px; max-width: 460px;">
        <span style="width: 24px; height: 24px; border-radius: 12px; background: #84cc16; display: flex; align-items: center; justify-content: center; color: #141210; box-shadow: 0 0 14px rgba(132,204,22,0.5);"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"></path></svg></span>
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f5efe6;">Pasted into Slack</span>
        <span style="width: 1px; height: 18px; background: rgba(255,220,170,0.15);"></span>
        <span style="font-size: 12px; color: rgba(245,239,230,0.5);">⌘Z to undo</span>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 24px;">
    <span style="width: 110px; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 16px; color: rgba(245,239,230,0.5);">Recording</span>
    <div style="flex-grow: 1; display: flex; justify-content: center;">
      <div style="height: 52px; border-radius: 999px; background: linear-gradient(180deg, #26211c, #1a1714); border: 1px solid rgba(239,68,68,0.4); box-shadow: 0 0 0 6px rgba(239,68,68,0.07), 0 20px 50px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.08) inset; display: flex; align-items: center; gap: 14px; padding: 0 10px 0 18px;">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #ef4444; box-shadow: 0 0 14px rgba(239,68,68,0.9); animation: dp-pulse 1.2s ease-in-out infinite;"></span>
        <span style="font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;">0:42</span>
        <span style="font-size: 12px; color: rgba(245,239,230,0.5);">1040 × 760 · 60 fps</span>
        <span style="width: 1px; height: 18px; background: rgba(255,220,170,0.15);"></span>
        <span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #f5efe6; color: #141210; font-weight: 600; display: flex; align-items: center; gap: 8px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #141210;"></span>Stop</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
