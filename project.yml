name: Deskpouch
options:
  bundleIdPrefix: com.constantinchirila
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Unsigned local builds for now (see PLAN.md, Distribution). Identity comes from Signing.xcconfig.
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # On even for local builds: without it any process running as the user can inject code into Deskpouch and use
    # its Accessibility, Microphone and Screen Recording grants. Notarization needs it too.
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  DeskpouchCore:
    path: Packages/DeskpouchCore
  DeskpouchCapture:
    path: Packages/DeskpouchCapture
  ToolVoice:
    path: Packages/ToolVoice
  ToolScreenRecorder:
    path: Packages/ToolScreenRecorder

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

targets:
  Deskpouch:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: App/Resources/AppIcon.icns
    dependencies:
      - package: DeskpouchCore
      - package: ToolVoice
      - package: ToolScreenRecorder
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Deskpouch
        CFBundleDisplayName: Deskpouch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Constantin Chirila"
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        NSMicrophoneUsageDescription: "Deskpouch records your voice while you hold the dictation key, and optionally during screen recordings."
        NSSpeechRecognitionUsageDescription: "Deskpouch can transcribe dictation with macOS's on-device speech recognition instead of a downloaded model."
    entitlements:
      path: App/Deskpouch.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Hardened runtime blocks the microphone without this.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.constantinchirila.deskpouch
        PRODUCT_NAME: Deskpouch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Deskpouch.entitlements
        # Debug builds otherwise split the app into Deskpouch.debug.dylib, which hardened runtime's library
        # validation refuses to load under a self-signed or ad-hoc identity (no Team ID). Costs only SwiftUI previews.
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  Deskpouch:
    build:
      targets:
        Deskpouch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: DeskpouchCore/DeskpouchCoreTests
        - package: ToolScreenRecorder/ToolScreenRecorderTests
        - package: ToolVoice/ToolVoiceTests
